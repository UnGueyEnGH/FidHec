{% load static %}
<!-- Hoja de estilos de la Navbar -->
<link rel="stylesheet" href="{% static 'css/navbar.css' %}">

<header class="navbar-header">
    <div class="navbar-container">
        
        <!-- Logotipo / Marca (Fijo a la izquierda) -->
        <a href="https://cecytem.edomex.gob.mx/" class="navbar-brand">
            <span class="brand-badge">CECYTEM</span>
        </a>

        <!-- Botón Hamburguesa para Móvil -->
        <button class="navbar-toggle" id="navbarToggle" aria-label="Abrir menú de navegación">
            <svg class="hamburger-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Navegación Principal -->
        <nav class="navbar-menu" id="navbarMenu">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="{% url 'inicio' %}" class="nav-link active">Inicio</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'metas' %}" class="nav-link">Visión de vida</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'lugares' %}" class="nav-link">Lugares maravillosos</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'colorimetria' %}" class="nav-link">Teoría del color</a>
                </li>
            </ul>
        </nav>

    </div>
</header>

<!-- Script para desplegar el menú móvil -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('navbarToggle');
        const menu = document.getElementById('navbarMenu');

        if (toggleBtn && menu) {
            toggleBtn.addEventListener('click', function() {
                menu.classList.toggle('is-active');
            });
        }
    });
</script>
